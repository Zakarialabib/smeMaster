name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --max-warnings=0

      - name: Frontend tests
        run: npx vitest run --exclude integration

      # Core app only — no ML sidecar (no protoc needed)
      - name: Rust check (core app only)
        run: cargo check -p smemaster --no-default-features
        working-directory: src-tauri

      - name: Rust tests (core app only)
        run: cargo test -p smemaster --no-default-features
        working-directory: src-tauri

      - name: Vite build
        run: npm run build

  # Separate job: build the ML sidecar (requires protoc)
  build-ml-sidecar:
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install protoc
        run: choco install protoc -y --no-progress

      - name: Build ML sidecar
        run: cargo build -p ml-sidecar --release --no-default-features
        working-directory: src-tauri

      - name: Copy to binaries/
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item src-tauri/target/release/ml-sidecar.exe src-tauri/binaries/ml-sidecar-x86_64-pc-windows-msvc.exe -Force

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-sidecar-windows
          path: src-tauri/binaries/
          retention-days: 7
