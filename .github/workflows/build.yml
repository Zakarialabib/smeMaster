name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Test ─────────────────────────────────────────────────────────
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src

      - name: Frontend tests
        run: npx vitest run --project unit --reporter=default

      # Tauri's build script validates externalBin paths even during cargo check.
      # Create a placeholder so the core app compiles without the ML sidecar.
      - name: Create ML sidecar placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Set-Content -Path src-tauri/binaries/ml-sidecar-x86_64-pc-windows-msvc.exe -Value ""

      - name: Rust check (core app - no ML sidecar)
        run: cargo check -p smemaster --no-default-features --features rustls-tls
        working-directory: src-tauri

      - name: Rust tests (core app - no ML sidecar)
        run: cargo test -p smemaster --no-default-features --features rustls-tls
        working-directory: src-tauri

      - name: Vite build
        run: npm run build

  # ── Desktop Build (Windows) ────────────────────────────────────────────
  build-desktop:
    runs-on: windows-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install protoc
        run: choco install protoc -y --no-progress

      - name: Install dependencies
        run: npm ci

      # Override vendored PROTOC path with system-installed protoc
      - name: Set PROTOC env var
        shell: pwsh
        run: |
          $protocPath = (Get-Command protoc).Source
          echo "PROTOC=$protocPath" >> $env:GITHUB_ENV

      - name: Build ML sidecar
        run: cargo build -p ml-sidecar --release --no-default-features
        working-directory: src-tauri

      - name: Copy sidecar to binaries/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item src-tauri/target/release/ml-sidecar.exe src-tauri/binaries/ml-sidecar-x86_64-pc-windows-msvc.exe -Force

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: '--no-default-features'
          uploadWorkflowArtifacts: true

  # ── Android Build ──────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Init Android project
        run: cargo tauri android init
        working-directory: src-tauri

      - name: Configure Rust for Android cross-compilation
        shell: bash
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android33-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CC_armv7_linux_androideabi=$NDK_BIN/armv7a-linux-androideabi33-clang" >> "$GITHUB_ENV"
          echo "AR_armv7_linux_androideabi=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CC_i686_linux_android=$NDK_BIN/i686-linux-android33-clang" >> "$GITHUB_ENV"
          echo "AR_i686_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=$NDK_BIN/x86_64-linux-android33-clang" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "PROTOC=$(which protoc)" >> "$GITHUB_ENV"

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        with:
          tauriScript: npx tauri
          mobile: 'android'
          args: '--no-default-features'
          uploadWorkflowArtifacts: true
